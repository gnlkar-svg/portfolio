<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifremi unuttum</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Şifremi unuttum</h1>
    <p class="lead">Hesabının e-posta adresini yaz. Kayıtlıysa şifreni sıfırlaman için bir bağlantı göndereceğiz.</p>
    <form data-api="/api/forgot-password" data-clear>
      <p class="message" role="status" aria-live="polite" hidden></p>
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Sıfırlama bağlantısı gönder</button>
    </form>
    <p class="links"><a href="/login">Giriş sayfasına dön</a></p>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
