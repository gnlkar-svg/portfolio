<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-postayı Doğrula</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>E-posta Doğrulama</h1>
    <div id="message"></div>
  </div>

  <script>
    async function verifyEmail() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('message').innerHTML = '<p class="error">Doğrulama bağlantısı geçersiz.</p>';
        return;
      }

      try {
        const res = await fetch('/api/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById('message').innerHTML = `
            <p class="success">${data.message}</p>
            <p><a href="/login">Giriş sayfasına git</a></p>
          `;
        } else {
          document.getElementById('message').innerHTML = `<p class="error">${data.error}</p>`;
        }
      } catch (err) {
        document.getElementById('message').innerHTML = '<p class="error">Bir hata oluştu.</p>';
      }
    }

    verifyEmail();
  </script>
</body>
</html>
