<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kayıt ol</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Kayıt ol</h1>
    <p class="lead">Yeni bir hesap oluştur.</p>
    <form data-api="/api/register" data-next="/login">
      <p class="message" role="status" aria-live="polite" hidden></p>
      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Şifre (en az 8 karakter)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm">Şifre (tekrar)</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Kayıt ol</button>
    </form>
    <p class="links">Zaten hesabın var mı? <a href="/login">Giriş yap</a></p>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
