<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yeni şifre belirle</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Yeni şifre belirle</h1>
    <p class="lead">Hesabın için yeni bir şifre seç.</p>
    <form data-api="/api/reset-password" data-next="/login">
      <p class="message" role="status" aria-live="polite" hidden></p>
      <input type="hidden" name="token" id="token">
      <label for="password">Yeni şifre (en az 8 karakter)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm">Yeni şifre (tekrar)</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Şifreyi değiştir</button>
    </form>
    <p class="links"><a href="/forgot-password">Yeni bağlantı iste</a> · <a href="/login">Giriş yap</a></p>
  </main>
  <script type="module">
    // Move the token into the form and out of the address bar (history, screenshots).
    const token = new URLSearchParams(location.search).get("token") || "";
    document.getElementById("token").value = token;
    history.replaceState(null, "", "/reset-password");
    if (!token) {
      const box = document.querySelector(".message");
      box.textContent = "Bu sayfayı e-postadaki bağlantıyla açmalısın.";
      box.className = "message error";
      box.hidden = false;
    }
  </script>
  <script src="/app.js" type="module"></script>
</body>
</html>
